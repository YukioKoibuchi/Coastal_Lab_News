# coastal-news-data リポジトリ用のGitHub Actionsワークフロー。
# このリポジトリはNetlifyと一切連携させないため、ここへの日次コミットは
# Netlifyの本番デプロイを発生させない（Coast_Lab_Homepage側は表示時にこの
# リポジトリのnews.jsonをfetchして読み込む方式にする。詳しくはREADME.md参照）。

name: Update Coastal News Data

on:
  schedule:
    # UTC 22:00 = JST 翌7:00（毎朝7時に実行する例。TODO: 好みの時刻に調整）
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 手動実行もできるようにしておく

permissions:
  contents: write  # このリポジトリへのコミット・プッシュに必要

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install feedparser requests beautifulsoup4

      - name: ニュースを収集してnews.jsonを生成
        working-directory: scripts
        run: python3 generate_site_news.py

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "coastal-news-bot"
          git config user.email "coastal-news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: update coastal news $(date -u +%F)"
          git push

      - name: jsDelivrのCDNキャッシュを更新（jsDelivr経由で読む場合のみ必要。任意）
        if: always()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/news.json" || true
